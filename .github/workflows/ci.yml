name: CI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - v*
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # compat is a separate module (it depends on the archived upstream
      # packages) so ./... from the root does not reach it.
      - name: Differential tests against upstream
        working-directory: compat
        run: go test -race ./...

      # A release tag points at a commit already pushed to main, so this
      # workflow also runs for the tag ref. Skip the upload then: it's the
      # same coverage.out for the same commit, and a second session on the
      # same SHA confuses Codecov's patch-coverage line attribution.
      - name: Upload coverage to Codecov
        if: github.ref_type != 'tag'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: true
